services:
  mysql:
    image: mysql:8.4
    container_name: mirattic-flow-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: mirattic_flow
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      retries: 10

volumes:
  mysql-data:
