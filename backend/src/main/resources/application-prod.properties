# 운영 프로파일. SPRING_PROFILES_ACTIVE=prod 로 켠다.
# 기본값을 두지 않은 항목은 환경변수가 없으면 기동이 실패한다 — 그게 의도다.
# 조용히 약한 기본값으로 떠 있는 것보다 안 뜨는 쪽이 낫다.

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:mirattic_flow}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ponytail: 운영에서도 ddl-auto=update 를 쓴다. 스키마를 코드가 따라가게 두는 편이
# 이 규모에서는 간단하다. 다만 컬럼 추가는 자동이어도 "기존 행의 뜻이 바뀌는" 변경은
# 아무도 해주지 않는다 (Phase 7 보정에서 겪었다). 그런 변경은 SQL 로 직접 남긴다.
# 운영 데이터가 진짜 쌓이기 시작하면 Flyway 로 옮긴다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# 쿼리 로그는 끈다. 운영 로그에 사용자 데이터가 섞여 남는다.
logging.level.org.hibernate.SQL=warn
logging.level.root=info

# 기본값 없음 — 반드시 주입해야 한다 (HS256, 32바이트 이상)
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-validity-ms=900000
app.jwt.refresh-token-validity-ms=1209600000

# 실제 도메인만 허용한다. localhost 가 남아 있으면 안 된다.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.oauth.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.oauth.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:}
app.oauth.registration.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.oauth.registration.naver.redirect-uri=${NAVER_REDIRECT_URI:}
