spring.application.name=flow

# backend/.env 가 있으면 읽는다 (없어도 기동된다).
# Spring Boot 는 .env 를 자동으로 읽지 않으므로 명시적으로 불러온다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mirattic_flow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=debug

# Mirattic Auth (기밀 클라이언트 mirattic-flow). 로컬 기본값은 Auth 의 local 프로파일과 짝이다
# (Auth 저장소 docs/clients.md: dev secret, dev redirect http://127.0.0.1:3000/auth/callback).
app.auth.issuer=${AUTH_ISSUER:http://127.0.0.1:9000}
app.auth.client-id=mirattic-flow
app.auth.client-secret=${AUTH_CLIENT_SECRET:dev-flow-secret}
app.auth.redirect-uri=${AUTH_REDIRECT_URI:http://127.0.0.1:3000/auth/callback}
app.auth.post-logout-redirect-uri=${AUTH_POST_LOGOUT_REDIRECT_URI:http://127.0.0.1:3000/login?logout=success}

# 로그인 콜백의 리다이렉트를 상대 경로(Location: /workspaces)로 보낸다. 절대 주소로 만들면 프록시
# (운영 Caddy, 개발 Next)를 거친 요청의 Host · 스킴으로 조립되어 백엔드 주소나 http:// 로 새어 나간다.
server.tomcat.use-relative-redirects=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:3000,http://localhost:3000}
