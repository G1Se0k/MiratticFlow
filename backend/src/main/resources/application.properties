spring.application.name=flow

# backend/.env 가 있으면 읽는다 (없어도 기동된다).
# Spring Boot 는 .env 를 자동으로 읽지 않으므로 명시적으로 불러온다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/mirattic_flow?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

logging.level.org.hibernate.SQL=debug

# JWT. secret 은 운영에서 반드시 환경변수로 덮어쓴다 (HS256 = 최소 32바이트)
app.jwt.secret=${JWT_SECRET:local-dev-secret-key-please-change-me-32bytes+}
app.jwt.access-token-validity-ms=900000
app.jwt.refresh-token-validity-ms=1209600000

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# 소셜 로그인. client-secret 은 저장소에 두지 않고 환경변수로만 주입한다.
app.oauth.registration.kakao.client-id=${KAKAO_CLIENT_ID:}
app.oauth.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.oauth.registration.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/callback/kakao}
app.oauth.registration.naver.client-id=${NAVER_CLIENT_ID:}
app.oauth.registration.naver.client-secret=${NAVER_CLIENT_SECRET:}
app.oauth.registration.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:3000/oauth/callback/naver}
