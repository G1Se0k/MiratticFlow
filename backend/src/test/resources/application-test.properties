# 테스트는 Docker 없이 돌도록 인메모리 H2 를 쓴다 (MySQL 호환 모드).
# 나머지 설정(open-in-view 등)은 main 의 application.properties 를 그대로 물려받는다.
spring.datasource.url=jdbc:h2:mem:flow;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
logging.level.org.hibernate.SQL=info

# Mirattic Auth 는 테스트에서 AuthStub(JDK HTTP 서버)이 대신한다. issuer 는 ApiTestSupport 가 넣는다.
app.auth.client-secret=test+secret/with=chars
app.auth.redirect-uri=https://flow.test/auth/callback
