# 운영 배포. 앱과 DB는 Docker, 공용 Caddy는 호스트에서 실행한다.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# 앱 포트는 호스트 루프백에만 공개한다.
# 호스트 Caddy가 127.0.0.1:3001 / 127.0.0.1:8080 으로 연결한다.

# 프로젝트 이름을 못 박는다. 비워 두면 디렉터리 이름으로 정해지는데,
# 같은 폴더의 개발용 docker-compose.yml 과 이름이 겹쳐 **볼륨을 공유한다**.
# 그러면 운영 스택이 개발 DB 를 집어 들거나 그 반대가 된다.
name: mirattic-flow-prod

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_NAME: ${DB_NAME}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      # Mirattic Auth client mirattic-flow 의 원본 secret (Auth 호스트의 client-secrets.txt). Auth 는 해시만 갖는다.
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    ports:
      - "127.0.0.1:3001:3000"
    build:
      context: ./frontend
      args:
        # 프론트는 브라우저에서 도는 코드라 같은 도메인으로 부른다.
        # Caddy 가 /api · /auth · /ws 만 백엔드로 넘긴다 — CORS 자체가 생기지 않는다.
        NEXT_PUBLIC_API_BASE_URL: https://${DOMAIN}
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mysql-data:
